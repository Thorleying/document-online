name: document-online

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    # utf8mb4 是必需的而非可选的：默认的 utf8 只有 3 字节，写入标题里的 emoji 会直接报错。
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-devroot}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-document_online}
      MYSQL_USER: ${MYSQL_USER:-app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-devpass}
    ports:
      # 显式绑定 127.0.0.1：开发数据库不应暴露到局域网。
      - "127.0.0.1:${MYSQL_PORT:-3309}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      # Prisma 迁移必须等数据库真正可连接，仅靠容器启动状态会导致迁移随机失败。
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "127.0.0.1",
          "-uroot",
          "-p$$MYSQL_ROOT_PASSWORD",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6381}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  mysql-data:
  redis-data:
